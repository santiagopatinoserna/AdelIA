[project]
name = "adelia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pgvector>=0.5.0",
    "boto3>=1.43.72",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "openai>=2.41.0",
    "tiktoken>=0.13.0",
    "mistralai>=2.9.3",
    "sse-starlette>=3.4.8",
    "jinja2>=3.1",
    "nh3>=0.3.6",
    "greenlet>=3.5.5",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
    "python-telegram-bot>=22.8",
    "weasyprint>=69.0",
    "stripe>=15.5.0",
    "anthropic>=0.122.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.16.3",
    "reportlab>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
