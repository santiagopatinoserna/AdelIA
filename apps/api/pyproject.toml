[project]
name = "adelia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pgvector>=0.5.0",
    "boto3>=1.43.89",
    "httpx>=0.27",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "openai>=2.41.0",
    "tiktoken>=0.14.0",
    "mistralai>=2.9.4",
    "sse-starlette>=3.4.11",
    "jinja2>=3.1",
    "nh3>=0.3.7",
    "greenlet>=3.5.5",
    "lxml>=6.1.3",
    "rapidfuzz>=3.14.6",
    "python-telegram-bot>=22.8",
    "weasyprint>=69.0",
    "stripe>=15.6.1",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.16.6",
    "reportlab>=4.5.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per-test ceiling (pytest-timeout). The suite talks to Postgres and MinIO, and
# to live APIs when keys exist, so an unattended run can hang on a socket. The
# slowest local test takes ~1.4s, so 120s only ever fires on a real hang. A test
# that legitimately needs longer takes @pytest.mark.timeout(n); do not raise this.
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
