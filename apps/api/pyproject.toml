[project]
name = "adelia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.50",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "boto3>=1.43.26",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "openai>=2.41.0",
    "tiktoken>=0.13.0",
    "mistralai>=2.4.9",
    "sse-starlette>=2.1",
    "jinja2>=3.1",
    "nh3>=0.2",
    "greenlet>=3.5.1",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
    "python-telegram-bot>=21.0",
    "weasyprint>=69.0",
    "stripe>=11.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.15.16",
    "reportlab>=4.5.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per-test ceiling (pytest-timeout). The suite talks to Postgres and MinIO, and
# to live APIs when keys exist, so an unattended run can hang on a socket. The
# slowest local test takes ~1.4s, so 120s only ever fires on a real hang. A test
# that legitimately needs longer takes @pytest.mark.timeout(n); do not raise this.
timeout = 120
markers = [
    "live_routing: runs the routing classifier against the real provider (needs a key)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
