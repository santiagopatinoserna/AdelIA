name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adelia
          POSTGRES_PASSWORD: adelia_ci
          POSTGRES_DB: adelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adelia -d adelia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: adelia
      POSTGRES_PASSWORD: adelia_ci
      POSTGRES_DB: adelia
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: adelia-ci
      AUTH_SECRET: ci-only-secret
      # No MISTRAL_API_KEY / OPENAI_API_KEY: live LLM tests self-skip.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6

      # Docker Hub no longer serves this image. Keep the same release and verify
      # the official GitHub asset rather than depending on an untrusted mirror.
      - name: Start MinIO
        run: |
          curl -fL --retry 3 \
            https://github.com/minio/minio/releases/download/RELEASE.2024-10-13T13-34-11Z/minio.linux-amd64.RELEASE.2024-10-13T13-34-11Z \
            -o "$RUNNER_TEMP/minio"
          echo "1126bbb3276321e7fed0167682d92a03572862f73802658f616af43d9a951e6a  $RUNNER_TEMP/minio" | sha256sum --check
          chmod +x "$RUNNER_TEMP/minio"
          export MINIO_ROOT_USER="$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$S3_SECRET_KEY"
          nohup "$RUNNER_TEMP/minio" server --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 1
          done
          curl -fsS http://localhost:9000/minio/health/live

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"

      - name: Install deps
        run: uv sync --frozen

      - name: Create CI bucket
        run: |
          uv run python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3", endpoint_url="http://localhost:9000",
              aws_access_key_id="minioadmin", aws_secret_access_key="minioadmin",
          )
          try:
              s3.create_bucket(Bucket="adelia-ci")
          except s3.exceptions.BucketAlreadyOwnedByYou:
              pass
          PY

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

      # Lint runs LAST on purpose. When it ran first, three unused-import
      # errors kept Migrations and Tests permanently "skipped" and the whole
      # backend suite stopped running in CI on 2026-07-02. A style error must
      # never be able to hide the test results.
      - name: Lint (ruff)
        run: uv run ruff check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable

      - name: Install deps
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: i18n catalogs parity (es/en/fr)
        run: |
          python3 - <<'PY'
          import json
          def flat(d, p=""):
              out = {}
              for k, v in d.items():
                  kk = f"{p}.{k}" if p else k
                  out.update(flat(v, kk)) if isinstance(v, dict) else out.update({kk: v})
              return out
          es, en, fr = (set(flat(json.load(open(f"messages/{l}.json")))) for l in ["es", "en", "fr"])
          missing = (es ^ en) | (es ^ fr)
          assert not missing, f"catalog key mismatch: {sorted(missing)[:10]}"
          print(f"parity OK: {len(es)} keys")
          PY

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  e2e:
    # Pinned: ubuntu-latest moved to 26.04, for which Playwright 1.60 ships no Chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64"), so every e2e job failed
    # at install. Move back to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    # Steps run inside the official Playwright image (noble = Ubuntu 24.04), which already has
    # Chromium and its system libraries. The browser install step used to run apt-get, and on
    # PR #80 (2026-11-11) it failed twice with "Temporary failure resolving
    # 'azure.archive.ubuntu.com'" (exit code 100), so no PR could pass. The tag MUST equal the
    # @playwright/test version in pnpm-lock.yaml: tests/test_ci_workflow.py (api job) and the
    # "Playwright image matches the lockfile" step below fail when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adelia
          POSTGRES_PASSWORD: adelia_ci
          POSTGRES_DB: adelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adelia -d adelia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # From inside the job container the service is reached by its name, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: adelia
      POSTGRES_PASSWORD: adelia_ci
      POSTGRES_DB: adelia
      AUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:3001
      # Dummy token: nothing here talks to Telegram, but the API refuses to
      # boot the diary surface without it and the specs that exercise the
      # diary cards were failing on config, not on product, since 2026-06-12.
      TELEGRAM_BOT_TOKEN: e2e-dummy
      # The admin of e2e/analytics-consent.spec.ts. config.py defaults the list
      # to empty (the repo is public), so without this the admin page is a 404.
      ADMIN_EMAILS: e2e-analytics-admin@adelia.test
      # No MISTRAL_API_KEY: the upload spec self-skips; auth/locale/a11y/GDPR run.
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"

      - name: API deps + migrations
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uv run uvicorn adelia.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Web deps + build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @adelia/web build

      - name: Start web
        working-directory: apps/web
        run: |
          nohup pnpm start -p 3001 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/es > /dev/null && break || sleep 1; done

      # No browser install: the image has them. Fail here, with a clear message, if the
      # lockfile moved without the image tag (Dependabot bumps only the npm package).
      - name: Playwright image matches the lockfile
        working-directory: apps/web
        run: |
          image="$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9.]+' \
            ../../.github/workflows/ci.yml | head -n 1)"
          image_version="${image##*:v}"
          locked_version="$(pnpm exec playwright --version | awk '{print $2}')"
          echo "image: $image_version  lockfile: $locked_version"
          if [ -z "$image_version" ] || [ "$image_version" != "$locked_version" ]; then
            echo "::error::Set the e2e container image to v$locked_version-noble in ci.yml"
            exit 1
          fi
          dirs="$(pnpm exec playwright install --dry-run chromium \
            | awk '/Install location:/ {print $3}')"
          test -n "$dirs"
          for dir in $dirs; do
            test -d "$dir" || { echo "::error::$dir is not in the image"; exit 1; }
          done

      - name: E2E
        working-directory: apps/web
        run: pnpm e2e

      - name: Logs on failure
        if: failure()
        run: tail -n 50 /tmp/api.log /tmp/web.log
