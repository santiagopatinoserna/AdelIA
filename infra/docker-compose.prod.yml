# AdelIA self-host production profile.
#   cp .env.prod.example .env.prod   # fill in secrets
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
# Web on :3000, API on :8000. Put a TLS proxy (Caddy/Traefik) in front for
# anything beyond a LAN.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-adelia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adelia} -d ${POSTGRES_DB:-adelia}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env.prod}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env.prod}
    volumes:
      - miniodata:/data
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c '
        mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" &&
        mc mb -p "local/$S3_BUCKET" || true
      '
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-adelia}

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-adelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-adelia}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-adelia}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env.prod}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set in .env.prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADELIA_APP_URL: ${ADELIA_APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${ADELIA_APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      # Telegram-first daily diary (bot replies + 20:00 reminder). Empty
      # token = feature off; the webhook endpoint answers 401.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Adelia_godiai_bot}
      DIARY_REMINDER_HOUR: ${DIARY_REMINDER_HOUR:-20}
      DIARY_REMINDER_TZ: ${DIARY_REMINDER_TZ:-Europe/Madrid}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        ADELIA_BUILD_ID: ${ADELIA_BUILD_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      API_INTERNAL_URL: http://api:8000
      NEXTAUTH_URL: ${ADELIA_APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-adelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-adelia}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-adelia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-adelia}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - pgbackups:/backups
    # A dump that is not restorable is worse than no dump: it looks like a
    # backup in `ls`. Measured on 2026-08-30 with the old entrypoint: this
    # sidecar started 27 ms BEFORE postgres (the Docker daemon does not honour
    # depends_on: service_healthy when it restarts containers after a reboot),
    # pg_dump died with "Connection refused", --file had already created the
    # file, and the retention prune ran anyway. Result: 7 of 16 dumps at
    # 0 bytes and a real RPO of 43 h behind a listing that showed 16 "copies".
    #
    # So: wait for pg_isready, verify the dump is non-empty AND readable by
    # pg_restore, delete it when it is not, prune only after a success, and
    # write /backups/LAST_GOOD_BACKUP so freshness can be checked from outside
    # without trusting the filenames.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        BACKUP_DIR=/backups
        MARKER="$$BACKUP_DIR/LAST_GOOD_BACKUP"
        RETRY_SECONDS=300
        echo "backup sidecar: every $${BACKUP_INTERVAL_SECONDS}s, retention $${BACKUP_RETENTION_DAYS}d"
        while true; do
          # 1. Postgres has to actually be accepting connections.
          ready=0
          i=1
          while [ "$$i" -le 60 ]; do
            if pg_isready -q; then ready=1; break; fi
            sleep 5
            i=$$((i + 1))
          done
          if [ "$$ready" -ne 1 ]; then
            echo "backup FAILED: postgres not ready after 300s" >&2
            sleep "$$RETRY_SECONDS"
            continue
          fi

          # 2. Dump, then prove the file is a real dump before believing it.
          STAMP=$$(date +%Y%m%d-%H%M%S)
          FILE="$$BACKUP_DIR/adelia-$$STAMP.dump"
          if pg_dump --format=custom --compress=6 --file="$$FILE" \
             && [ -s "$$FILE" ] \
             && pg_restore --list "$$FILE" >/dev/null 2>&1; then
            echo "backup ok: adelia-$$STAMP.dump ($$(du -h "$$FILE" | cut -f1))"
            # 3. Marker with the date of the last VALID dump. An external
            #    check reads this one file instead of guessing from `ls`.
            printf '%s adelia-%s.dump %s\n' \
              "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$STAMP" "$$(wc -c < "$$FILE" | tr -d ' ')" \
              > "$$MARKER.tmp" && mv "$$MARKER.tmp" "$$MARKER"
            # 4. Prune ONLY after a success, and only real dumps. Clean up any
            #    0-byte leftovers from before this fix in the same pass.
            find "$$BACKUP_DIR" -name 'adelia-*.dump' -type f -size 0 -delete
            find "$$BACKUP_DIR" -name 'adelia-*.dump' -type f -size +0c \
              -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          else
            # 5. A failed dump leaves no file behind to be mistaken for one.
            echo "backup FAILED at $$STAMP (dump removed, retention NOT pruned)" >&2
            rm -f "$$FILE"
            sleep "$$RETRY_SECONDS"
            continue
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  pgdata:
  miniodata:
  pgbackups:
