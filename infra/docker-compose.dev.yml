services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adelia
      POSTGRES_PASSWORD: adelia_dev
      POSTGRES_DB: adelia
    ports:
      - "5434:5432"  # host 5434 because 5432 already used by intravel-db + factory-db + local Homebrew Postgres
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adelia -d adelia"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      sh -c '
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/adelia-dev || true &&
        echo "Bucket adelia-dev ready"
      '
