services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: adelia
      POSTGRES_PASSWORD: adelia_dev
      POSTGRES_DB: adelia
    ports:
      # Loopback only. This dev stack runs on the same machine as production
      # and its credentials are published in this repo, so a LAN bind is an
      # open door to the box: measured 2026-08-31, `ss -ltnp` showed
      # 0.0.0.0:5434. Nothing needs it from outside; server-verify.sh and
      # pytest reach it as localhost, and the API container reaches it over
      # the compose network on 5432.
      # host 5434 because 5432 is already used by intravel-db + factory-db + local Homebrew Postgres
      - "127.0.0.1:5434:5432"
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adelia -d adelia"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports:
      # Loopback only, same reason as postgres above: minioadmin/minioadmin is
      # in this file, and 9001 is the console that those credentials open.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      sh -c '
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/adelia-dev || true &&
        echo "Bucket adelia-dev ready"
      '
